services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ironbook-sqlserver
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Change_this_dev_password_123!}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ironbook
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ironbook-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ironbook}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change_this_rabbit_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ironbook
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ironbook-api:
    build:
      context: .
      dockerfile: backend/IronBook.Api/Dockerfile
    container_name: ironbook-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Server=sqlserver,1433;Database=190027;User Id=sa;Password=Change_this_dev_password_123!;TrustServerCertificate=True;}
      RabbitMQ__Host: ${RabbitMQ__Host:-rabbitmq}
      RabbitMQ__Port: ${RabbitMQ__Port:-5672}
      RabbitMQ__Username: ${RabbitMQ__Username:-ironbook}
      RabbitMQ__Password: ${RabbitMQ__Password:-change_this_rabbit_password}
      Jwt__Issuer: ${Jwt__Issuer:-IronBook}
      Jwt__Audience: ${Jwt__Audience:-IronBookClients}
      Jwt__SigningKey: ${Jwt__SigningKey:-replace_with_a_long_local_development_key}
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ironbook

  ironbook-notifications-worker:
    build:
      context: .
      dockerfile: backend/IronBook.Notifications.Worker/Dockerfile
    container_name: ironbook-notifications-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Server=sqlserver,1433;Database=190027;User Id=sa;Password=Change_this_dev_password_123!;TrustServerCertificate=True;}
      RabbitMQ__Host: ${RabbitMQ__Host:-rabbitmq}
      RabbitMQ__Port: ${RabbitMQ__Port:-5672}
      RabbitMQ__Username: ${RabbitMQ__Username:-ironbook}
      RabbitMQ__Password: ${RabbitMQ__Password:-change_this_rabbit_password}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ironbook

networks:
  ironbook:
    name: ironbook-network

volumes:
  sqlserver-data:
